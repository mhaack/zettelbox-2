          if (id(claude_session_usage).has_state()) snprintf(buf, sizeof(buf), "%.0f", id(claude_session_usage).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL1, ROW1, "Session", buf, "%");
          it.image(COL1 + CARD_W - PAD - 18, ROW1 + PAD, id(img_timer_sand));

          if (id(claude_week_usage).has_state()) snprintf(buf, sizeof(buf), "%.0f", id(claude_week_usage).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL2, ROW1, "Woche", buf, "%");
          it.image(COL2 + CARD_W - PAD - 18, ROW1 + PAD, id(img_calendar_week));

          // Parse ISO 8601 UTC datetime, return total minutes remaining
          auto mins_until = [&](const std::string& s) -> int {
            int yr, mo, dy, hr, mn, sc;
            if (sscanf(s.c_str(), "%4d-%2d-%2dT%2d:%2d:%2d", &yr, &mo, &dy, &hr, &mn, &sc) != 6) return -1;
            const int md[] = {31,28,31,30,31,30,31,31,30,31,30,31};
            bool leap = (yr%4==0 && (yr%100!=0 || yr%400==0));
            long long days = 0;
            for (int y = 1970; y < yr; y++) days += (y%4==0 && (y%100!=0 || y%400==0)) ? 366 : 365;
            for (int m = 0; m < mo-1; m++) { days += md[m]; if (m==1 && leap) days++; }
