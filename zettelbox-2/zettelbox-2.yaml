              int days = total_s / 86400;
              int hours = (total_s % 86400) / 3600;
              int mins = (total_s % 3600) / 60;
              if (days > 0) snprintf(uptime_buf, sizeof(uptime_buf), "%dd %dh", days, hours);
              else if (hours > 0) snprintf(uptime_buf, sizeof(uptime_buf), "%dh %dm", hours, mins);
              else snprintf(uptime_buf, sizeof(uptime_buf), "%dm", mins);
            } else {
              snprintf(uptime_buf, sizeof(uptime_buf), "--");
            }
            it.print(COL1 + CARD_W / 2, ROW2 + CARD_H - 20, id(font_20), TextAlign::BASELINE_CENTER, uptime_buf);
          }

          // Current time card
          {
            it.rectangle(COL2, ROW2, CARD_W, CARD_H);
            it.print(COL2 + PAD, ROW2 + PAD + 10, id(font_14), TextAlign::BASELINE_LEFT, "Zeit");
            it.image(COL2 + CARD_W - PAD - 18, ROW2 + PAD, id(img_clock));
            auto now = id(homeassistant_time).now();
            if (now.is_valid())
              it.strftime(COL2 + CARD_W / 2, ROW2 + CARD_H - 20, id(font_20), TextAlign::BASELINE_CENTER, "%H:%M", now);
          }
