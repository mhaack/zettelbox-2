  - file: "gfonts://Roboto"
    id: font_14
    size: 14
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°äöüÄÖÜß"
  - file: "gfonts://Roboto"
    id: font_20
    size: 20
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°äöüÄÖÜß"

display:
  - platform: waveshare_epaper
    id: epaper_display
    cs_pin: GPIO15
    dc_pin: GPIO27
    busy_pin: GPIO25
    reset_pin: GPIO26
    model: 2.70in
    rotation: 90
    update_interval: never
    pages:
      - id: page_weather
        lambda: |-
          int W = it.get_width();
          int H = it.get_height();
          int PAD = 6;
          int STATUS_H = 20;

          auto draw_status_bar = [&](const char* title, int page_num) {
            it.print(PAD + 20, STATUS_H / 2, id(font_12), TextAlign::CENTER_LEFT, title);
            auto now = id(homeassistant_time).now();
            if (now.is_valid())
              it.strftime(W - PAD - 20, STATUS_H / 2, id(font_12), TextAlign::CENTER_RIGHT, "%H:%M", now);
            int cx = W - PAD - 8, cy = STATUS_H / 2;
            it.circle(cx, cy, 8);
            char pg_str[2];
            snprintf(pg_str, sizeof(pg_str), "%d", page_num);
            it.print(cx, cy, id(font_12), TextAlign::CENTER, pg_str);
            it.line(0, STATUS_H, W, STATUS_H);
          };

          draw_status_bar("Wetter", 1);
          it.image(PAD, 2, id(img_weather_status));

          // Map condition string to icon
          auto* cond_img = id(img_weather_cloudy);
          if (id(weather_condition).has_state()) {
            const std::string& c = id(weather_condition).state;
            if (c == "sunny")               cond_img = id(img_weather_sunny);
            else if (c == "clear-night")    cond_img = id(img_weather_night);
            else if (c == "partlycloudy")   cond_img = id(img_weather_partlycloudy);
            else if (c == "cloudy")         cond_img = id(img_weather_cloudy);
            else if (c == "rainy")          cond_img = id(img_weather_rainy);
            else if (c == "pouring")        cond_img = id(img_weather_pouring);
            else if (c == "snowy")          cond_img = id(img_weather_snowy);
            else if (c == "snowy-rainy")    cond_img = id(img_weather_snowy_rainy);
            else if (c == "fog")            cond_img = id(img_weather_fog);
            else if (c == "hail")           cond_img = id(img_weather_hail);
            else if (c == "lightning")      cond_img = id(img_weather_lightning);
            else if (c == "lightning-rainy") cond_img = id(img_weather_lightning_rainy);
            else if (c == "windy")          cond_img = id(img_weather_windy);
            else if (c == "windy-variant")  cond_img = id(img_weather_windy_variant);
            else if (c == "exceptional")    cond_img = id(img_weather_exceptional);
          }
          it.image(W / 2 - 32, 44, cond_img);

          // Temperature
          char buf[12];
          if (id(weather_temp).has_state()) snprintf(buf, sizeof(buf), "%.1f", id(weather_temp).state);
          else snprintf(buf, sizeof(buf), "--");
          it.print(W / 2, 133, id(font_20), TextAlign::BASELINE_RIGHT, buf);
          it.print(W / 2 + 3, 133, id(font_12), TextAlign::BASELINE_LEFT, "°C");

          // Wind direction + speed
          char wind_buf[20];
          if (id(weather_wind_speed).has_state() && id(weather_wind_bearing).has_state()) {
            float b = id(weather_wind_bearing).state;
            const char* dir = "N";
            if      (b >=  22.5 && b <  67.5) dir = "NO";
            else if (b >=  67.5 && b < 112.5) dir = "O";
            else if (b >= 112.5 && b < 157.5) dir = "SO";
            else if (b >= 157.5 && b < 202.5) dir = "S";
            else if (b >= 202.5 && b < 247.5) dir = "SW";
            else if (b >= 247.5 && b < 292.5) dir = "W";
            else if (b >= 292.5 && b < 337.5) dir = "NW";
            snprintf(wind_buf, sizeof(wind_buf), "Wind %.1f km/h (%s)", id(weather_wind_speed).state, dir);
          } else {
            snprintf(wind_buf, sizeof(wind_buf), "--");
          }
          it.print(W / 2, 153, id(font_14), TextAlign::BASELINE_CENTER, wind_buf);

      - id: page1
        lambda: |-
          int W = it.get_width();
          int H = it.get_height();
          int PAD = 6;
          int STATUS_H = 20;
          int CARD_H = (H - STATUS_H - 3 * PAD) / 2;
          int CARD_W = (W - 4 * PAD) / 3;

          auto draw_status_bar = [&](const char* title, int page_num) {
            it.print(PAD + 20, STATUS_H / 2, id(font_12), TextAlign::CENTER_LEFT, title);
            auto now = id(homeassistant_time).now();
            if (now.is_valid())
              it.strftime(W - PAD - 20, STATUS_H / 2, id(font_12), TextAlign::CENTER_RIGHT, "%H:%M", now);
            int cx = W - PAD - 8, cy = STATUS_H / 2;
            it.circle(cx, cy, 8);
            char pg_str[2];
            snprintf(pg_str, sizeof(pg_str), "%d", page_num);
            it.print(cx, cy, id(font_12), TextAlign::CENTER, pg_str);
            it.line(0, STATUS_H, W, STATUS_H);
          };

          auto draw_card = [&](int x, int y, const char* label, const char* value, const char* unit, int x_offset = 0) {
            int mid = x + CARD_W / 2 + x_offset;
            int val_base = y + CARD_H - 20;
            it.rectangle(x, y, CARD_W, CARD_H);
            it.print(x + PAD, y + PAD + 10, id(font_12), TextAlign::BASELINE_LEFT, label);
            if (unit[0] != '\0') {
              it.print(mid, val_base, id(font_20), TextAlign::BASELINE_RIGHT, value);
              it.print(mid + 3, val_base, id(font_12), TextAlign::BASELINE_LEFT, unit);
            } else {
              it.print(mid, val_base, id(font_20), TextAlign::BASELINE_CENTER, value);
            }
          };

          int COL1 = PAD;
          int COL2 = PAD + CARD_W + PAD;
          int COL3 = COL2 + CARD_W + PAD;
          int ROW1 = STATUS_H + PAD;
          int ROW2 = ROW1 + CARD_H + PAD;

          draw_status_bar("Energie", 2);
          it.image(PAD, 2, id(img_flash));

          char buf[12];

          if (id(energy_today).has_state()) snprintf(buf, sizeof(buf), "%.1f", id(energy_today).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL1, ROW1, "Solar", buf, "kWh", 4);
          it.image(COL1 + CARD_W - PAD - 18, ROW1 + PAD, id(img_sunny));

          if (id(storage_level).has_state()) snprintf(buf, sizeof(buf), "%.0f", id(storage_level).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL2, ROW1, "Batterie", buf, "%", 4);
          {
            float lvl = id(storage_level).state;
            auto batt_img = (!id(storage_level).has_state() || lvl < 30) ? id(img_batt_low)
                            : (lvl < 70) ? id(img_batt_med)
                            : id(img_batt_high);
            it.image(COL2 + CARD_W - PAD - 18, ROW1 + PAD, batt_img);
          }

          if (id(consumption_energy).has_state()) snprintf(buf, sizeof(buf), "%.1f", id(consumption_energy).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL3, ROW1, "Verbrauch", buf, "kWh", 4);

          if (id(exported_energy).has_state()) snprintf(buf, sizeof(buf), "%.1f", id(exported_energy).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL1, ROW2, "Export", buf, "kWh", 4);
          it.image(COL1 + CARD_W - PAD - 18, ROW2 + PAD, id(img_tower_export));

          if (id(imported_energy).has_state()) snprintf(buf, sizeof(buf), "%.1f", id(imported_energy).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL2, ROW2, "Import", buf, "kWh", 4);
          it.image(COL2 + CARD_W - PAD - 18, ROW2 + PAD, id(img_tower_import));

          if (id(exported_energy).has_state() && id(imported_energy).has_state())
            snprintf(buf, sizeof(buf), "%.1f", id(exported_energy).state - id(imported_energy).state);
          else snprintf(buf, sizeof(buf), "--");
          draw_card(COL3, ROW2, "Netz", buf, "kWh", 4);
          it.image(COL3 + CARD_W - PAD - 18, ROW2 + PAD, id(img_tower));

      - id: page2
        lambda: |-
          int W = it.get_width();
          int H = it.get_height();
          int PAD = 6;
          int STATUS_H = 20;
          int CARD_H = (H - STATUS_H - 3 * PAD) / 2;
          int CARD_W = (W - 3 * PAD) / 2;

          auto draw_status_bar = [&](const char* title, int page_num) {
            it.print(PAD + 20, STATUS_H / 2, id(font_12), TextAlign::CENTER_LEFT, title);
            auto now = id(homeassistant_time).now();
            if (now.is_valid())
              it.strftime(W - PAD - 20, STATUS_H / 2, id(font_12), TextAlign::CENTER_RIGHT, "%H:%M", now);
            int cx = W - PAD - 8, cy = STATUS_H / 2;
            it.circle(cx, cy, 8);
            char pg_str[2];
            snprintf(pg_str, sizeof(pg_str), "%d", page_num);
            it.print(cx, cy, id(font_12), TextAlign::CENTER, pg_str);
            it.line(0, STATUS_H, W, STATUS_H);
          };

          auto draw_card = [&](int x, int y, const char* label, const char* value, const char* unit, int x_offset = 0) {
            int mid = x + CARD_W / 2 + x_offset;
            int val_base = y + CARD_H - 20;
            it.rectangle(x, y, CARD_W, CARD_H);
            it.print(x + PAD, y + PAD + 10, id(font_14), TextAlign::BASELINE_LEFT, label);
            if (unit[0] != '\0') {
              it.print(mid, val_base, id(font_20), TextAlign::BASELINE_RIGHT, value);
