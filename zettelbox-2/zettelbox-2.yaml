            long long reset_ts = days * 86400LL + hr*3600 + mn*60 + sc;
            long long now_ts = (long long)id(homeassistant_time).now().timestamp;
            long long diff = reset_ts - now_ts;
            return diff > 0 ? (int)(diff / 60) : 0;
          };

