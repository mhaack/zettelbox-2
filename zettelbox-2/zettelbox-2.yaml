substitutions:
  pirsch_domain_id: !secret pirsch_domain_id
  pirsch_client_id: !secret pirsch_client_id
  pirsch_client_secret: !secret pirsch_client_secret

packages:
  pirsch: !include pirsch-analytics.yaml

esphome:
  name: zettelbox-2
  build_path: ../dist
  on_boot:
    priority: -100
    then:
      - delay: 10s
      - wait_until:
          condition:
            lambda: 'return id(homeassistant_time).now().is_valid();'
      - script.execute: pirsch_fetch_stats
      - script.wait: pirsch_fetch_stats
      - script.wait: pirsch_get_stats
      - script.wait: pirsch_get_stats_today
      - lambda: |-
          auto t = id(homeassistant_time).now();
          if (t.is_valid()) {
            char buf[6];
            t.strftime(buf, sizeof(buf), "%H:%M");
            id(last_update_str) = std::string(buf);
          }
      - script.execute: update_display

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

debug:
  update_interval: 60s

mdns:
  disabled: true

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

http_request:
  timeout: 10s
  buffer_size_rx: 4096
  buffer_size_tx: 4096

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /30
        then:
          - display.page.show_next: epaper_display
          - component.update: epaper_display

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 60s

  - platform: homeassistant
    entity_id: sensor.garden_temperature
    id: garden_temp

  - platform: homeassistant
    entity_id: sensor.livingroom_temperature
    id: indoor_temp

  - platform: homeassistant
    entity_id: sensor.solaredge_imported_energy
    id: imported_energy

  - platform: homeassistant
    entity_id: sensor.solaredge_exported_energy
    id: exported_energy

  - platform: homeassistant
    entity_id: sensor.solaredge_consumption_energy
    id: consumption_energy

  - platform: homeassistant
    entity_id: sensor.solaredge_storage_level
    id: storage_level
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: homeassistant
    entity_id: sensor.solaredge_energy_today
    id: energy_today

  - platform: homeassistant
    entity_id: sensor.pool_solar_temperature
    id: pool_solar_temperature

  - platform: homeassistant
    entity_id: sensor.pool_water_temperature_2
    id: pool_water_temperature

  - platform: homeassistant
    entity_id: sensor.polestar_4_current_odometer
    id: car_odometer

  - platform: homeassistant
    entity_id: sensor.polestar_4_battery_charge_level
    id: car_charge_level
    unit_of_measurement: "%"

  - platform: homeassistant
    entity_id: sensor.polestar_4_estimated_range
    id: car_range

  - platform: homeassistant
    entity_id: sensor.polestar_4_charging_power
    id: car_charging_power

  - platform: homeassistant
    entity_id: sensor.claude_usage_session_usage
    id: claude_session_usage
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: homeassistant
    entity_id: sensor.claude_usage_week_usage
    id: claude_week_usage
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: homeassistant
    entity_id: sensor.livingroom_humidity
    id: indoor_humidity
    accuracy_decimals: 0

  - platform: homeassistant
    entity_id: sensor.garden_feinstaub_pm2_5
    id: garden_pm25

  - platform: uptime
    id: uptime_s
    type: seconds

  - platform: homeassistant
    entity_id: weather.jama_villa
    id: weather_temp
    attribute: temperature
    accuracy_decimals: 1

  - platform: homeassistant
    entity_id: weather.jama_villa
    id: weather_wind_speed
    attribute: wind_speed
    accuracy_decimals: 1

  - platform: homeassistant
    entity_id: weather.jama_villa
    id: weather_wind_bearing
    attribute: wind_bearing
    accuracy_decimals: 0

binary_sensor:
  - platform: homeassistant
    entity_id: binary_sensor.pool_pump_state
    id: pool_pump_state

  - platform: homeassistant
    entity_id: binary_sensor.pool_valve_state
    id: pool_valve_state

text_sensor:
  - platform: homeassistant
    entity_id: sensor.waste_collection
    id: waste_next

  - platform: homeassistant
    entity_id: sensor.polestar_4_charging_status
    id: car_charging_status

  - platform: homeassistant
    entity_id: sensor.claude_usage_session_reset_time
    id: claude_session_reset_time

  - platform: homeassistant
    entity_id: sensor.claude_usage_weekly_reset_time
    id: claude_weekly_reset_time

  - platform: wifi_info
    ip_address:
      id: wifi_ip

  - platform: homeassistant
    entity_id: weather.jama_villa
    id: weather_condition

globals:
  - id: last_update_str
    type: std::string
    restore_value: false
    initial_value: '"--:--"'

script:
  - id: update_display
    then:
      - component.update: epaper_display

interval:
  - interval: 30min
    then:
      - script.execute: pirsch_fetch_stats
      - script.wait: pirsch_fetch_stats
      - script.wait: pirsch_get_stats
      - script.wait: pirsch_get_stats_today
      - lambda: |-
          auto t = id(homeassistant_time).now();
          if (t.is_valid()) {
            char buf[6];
            t.strftime(buf, sizeof(buf), "%H:%M");
            id(last_update_str) = std::string(buf);
          }
      - script.execute: update_display

